<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Pickaxe handle -->
  <rect x="10" y="110" width="8" height="8" fill="#8B6914"/>
  <rect x="18" y="102" width="8" height="8" fill="#A07A2A"/>
  <rect x="26" y="94" width="8" height="8" fill="#8B6914"/>
  <rect x="34" y="86" width="8" height="8" fill="#A07A2A"/>
  <rect x="42" y="78" width="8" height="8" fill="#8B6914"/>
  <rect x="50" y="70" width="8" height="8" fill="#A07A2A"/>

  <!-- Pickaxe head -->
  <rect x="54" y="62" width="10" height="10" fill="#A8A8A8"/>
  <rect x="64" y="54" width="10" height="10" fill="#7F7F7F"/>
  <rect x="74" y="46" width="10" height="10" fill="#A8A8A8"/>
  <rect x="84" y="38" width="10" height="10" fill="#7F7F7F"/>
  <rect x="94" y="30" width="10" height="10" fill="#A8A8A8"/>
  <rect x="104" y="22" width="10" height="10" fill="#52525b"/>

  <!-- Pickaxe shine -->
  <rect x="64" y="54" width="5" height="5" fill="#C0C0C0" opacity="0.5"/>
  <rect x="84" y="38" width="5" height="5" fill="#C0C0C0" opacity="0.4"/>

  <!-- Pickaxe tip glow -->
  <rect x="110" y="16" width="6" height="6" fill="#22c55e" opacity="0.7"/>
  <rect x="108" y="18" width="4" height="4" fill="#22c55e" opacity="0.4"/>

  <!-- Sparks -->
  <rect x="46" y="74" width="4" height="4" fill="#FCDB05" opacity="0.8"/>
  <rect x="58" y="62" width="4" height="4" fill="#FCDB05" opacity="0.6"/>
  <rect x="70" y="50" width="3" height="3" fill="#FFAA00" opacity="0.5"/>
  <rect x="38" y="82" width="3" height="3" fill="#FCDB05" opacity="0.4"/>
</svg>
